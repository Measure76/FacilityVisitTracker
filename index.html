<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facility Visit Tracker</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --text:#1c2230; --muted:#5e6777; --border:#d8dce3;
  --accent:#2457c5; --accent-text:#ffffff;
  --red:#b42318; --red-bg:#fdeceb; --amber:#8a5a00; --amber-bg:#fff4d8;
  --green:#1e6b3a; --green-bg:#e4f4e9; --blue:#2457c5; --blue-bg:#e7eefc; --gray-bg:#eef0f3; --pto:#7a4fc0; --bank:#0f7f7a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161b; --panel:#1c2027; --text:#e6e9ee; --muted:#9aa3b2; --border:#323843;
    --accent:#6f9cff; --accent-text:#0b1020;
    --red:#ff8f85; --red-bg:#3b1f1d; --amber:#f2c065; --amber-bg:#3a3018;
    --green:#82d69c; --green-bg:#18301f; --blue:#8fb2ff; --blue-bg:#1d2a44; --gray-bg:#262b33; --pto:#b796f0; --bank:#5cc8c0;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header h1{font-size:20px;margin:0 0 12px}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:16px}
nav button{background:none;border:none;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);font:inherit;cursor:pointer}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
header.top h1{margin:0}
.linkish{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline}
body.signed-out nav,body.signed-out #who{display:none}
.signin{max-width:380px;margin:24px auto}
nav button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
nav .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--red);color:var(--panel);font-size:12px;text-align:center}
button,.btn{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
button.danger{color:var(--red)}
button.small{padding:3px 9px;font-size:13px}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);max-width:100%}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--muted)}
label input:not([type=checkbox]),label select,label textarea{display:block;width:100%;margin-top:3px;font-size:15px}
label.check{display:flex;gap:8px;align-items:center;color:var(--text);font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar label{margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:8px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--border);min-width:120px}
.chip b{display:block;font-size:22px;line-height:1.1}
.chip.red b{color:var(--red)} .chip.amber b{color:var(--amber)} .chip.blue b{color:var(--blue)}
.card{background:var(--panel);border:1px solid var(--border);border-left:5px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.card.overdue,.card.never{border-left-color:var(--red)} .card.soon{border-left-color:var(--amber)} .card.ok{border-left-color:var(--green)} .card.ancillary{border-left-color:var(--border)}
.badge.ancillary{background:var(--gray-bg);color:var(--muted);cursor:help}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.fname{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin:6px 0;font-size:14px}
.badge{display:inline-block;white-space:nowrap;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.badge.overdue,.badge.never{background:var(--red-bg);color:var(--red)}
.badge.soon{background:var(--amber-bg);color:var(--amber)}
.badge.ok{background:var(--green-bg);color:var(--green)}
.badge.fly{background:var(--blue-bg);color:var(--blue)}
.badge.gray{background:var(--gray-bg);color:var(--muted)}
.warn{color:var(--red);font-weight:600}
.actions{display:flex;gap:6px;flex-wrap:wrap}
h2{font-size:17px;margin:18px 0 8px}
.cap{text-transform:none;letter-spacing:0;font-weight:normal}
h3{font-size:14px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.list{background:var(--panel);border:1px solid var(--border);border-radius:8px}
.item{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--border);flex-wrap:wrap}
.item:first-child{border-top:none}
.item .date{min-width:92px;flex-shrink:0;font-variant-numeric:tabular-nums}
.item .what{flex:1;min-width:150px}
.item.done .what{color:var(--muted)}
.empty{padding:12px;color:var(--muted)}
.banner{background:var(--amber-bg);color:var(--amber);border-radius:8px;padding:8px 12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px}
.hint{background:var(--panel);border:1px dashed var(--border);border-radius:8px;padding:10px 12px;margin-bottom:14px}
.hint .row{margin-top:6px}
dialog{border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);padding:16px;width:min(480px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin-top:0}
.dlg-actions{display:flex;gap:8px;margin-top:6px}
textarea.out{width:100%;height:300px;font:13px/1.4 ui-monospace,Consolas,monospace}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 6px}
body[data-view=schedule] .wrap{max-width:1240px}
.sched{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;align-items:start;margin-top:12px}
.side{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow-y:auto}
.side h3{margin-top:0}
.side .palette{flex-direction:column;flex-wrap:nowrap;margin:0 0 8px}
.side .pchip{width:100%;text-align:left}
.side .pchip .sub{display:block;margin-left:0}
@media (max-width:760px){
  .sched{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .side .palette{flex-direction:row;flex-wrap:wrap}
  .side .pchip{width:auto}
  .side .pchip .sub{display:inline;margin-left:4px}
}
.pchip{font:inherit;font-size:13px;border:1px solid var(--border);border-left:4px solid var(--green);border-radius:6px;padding:4px 8px;background:var(--panel);color:var(--text);cursor:grab;user-select:none;-webkit-user-select:none}
.pchip.overdue,.pchip.never{border-left-color:var(--red)} .pchip.soon{border-left-color:var(--amber)} .pchip.ancillary{border-left-color:var(--muted)}
.pchip .sub{color:var(--muted);font-size:11px;margin-left:4px}
.pchip.booked{opacity:.45}
.pchip.team{border-left-color:var(--blue);background:var(--blue-bg)}
.pchip.armed{outline:2px solid var(--accent);outline-offset:1px}
.palette-hint{font-size:12px;color:var(--muted);margin:0 0 12px}
.calwrap{overflow-x:auto;margin-bottom:16px}
.cal{display:grid;grid-template-columns:minmax(0,.45fr) repeat(5,minmax(0,1fr)) minmax(0,.45fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;min-width:600px}
.cal .dow{background:var(--gray-bg);font-size:12px;color:var(--muted);padding:4px;text-align:center}
.cal .wk{grid-column:1/-1;background:var(--bg);font-size:12px;color:var(--muted);padding:6px 6px 3px}
.day{background:var(--panel);min-height:78px;padding:4px;min-width:0;font-size:12px}
.day.weekend,.day.office{background:var(--gray-bg)}
.day.holiday{background:var(--amber-bg)}
.day.over{outline:2px dashed var(--accent);outline-offset:-3px}
body.placing .day{cursor:copy}
.dnum{font-weight:600}
.day.past .dnum{color:var(--muted);font-weight:normal}
.day.today .dnum{background:var(--accent);color:var(--accent-text);border-radius:9px;padding:0 6px}
.dtag{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.holiday .dtag{color:var(--amber);font-weight:600}
.ev{display:block;width:100%;margin-top:3px;padding:2px 5px;border:none;border-left:3px solid var(--accent);border-radius:4px;background:var(--blue-bg);color:var(--text);font:inherit;font-size:12px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev.done{border-left-color:var(--green);background:var(--green-bg);color:var(--green)}
.ev.team{border-left:none;background:var(--accent);color:var(--accent-text);border-radius:0;margin-left:-4px;margin-right:-4px;width:calc(100% + 8px);padding-left:9px}
.ev.team.pto{background:var(--pto)} .ev.team.bank{background:var(--bank)}
.pchip.pto{border-left-color:var(--pto)} .pchip.bank{border-left-color:var(--bank)}
.quick{margin:16px 0 0}
.ev.team.first{border-radius:4px 0 0 4px;margin-left:0;width:calc(100% + 4px);padding-left:5px}
.ev.team.last{border-radius:0 4px 4px 0;margin-right:0;width:calc(100% + 4px)}
.ev.team.first.last{border-radius:4px;width:100%}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media (max-width:560px){ .item .date{width:auto} .chip{min-width:0;flex:1} .wide-only{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>Facility Visit Tracker</h1>
    <div id="who" class="small muted"></div></header>
  <nav id="tabs">
    <button data-tab="status">Status</button>
    <button data-tab="schedule">Schedule</button>
    <button data-tab="log">Visit log</button>
    <button data-tab="facilities">Facilities</button>
    <button data-tab="settings">Data &amp; settings</button>
  </nav>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<dialog id="visitDlg">
  <form id="visitForm">
    <h2 id="visitTitle">Visit</h2>
    <label>Date<input type="date" name="date" required></label>
    <label>Where<select name="facilityId"></select></label>
    <label id="otherWrap">What is it?<input name="label" placeholder="Team meeting, team project, PTO…"></label>
    <label id="endWrap">Last day (for multi-day meetings and projects)<input type="date" name="endDate"></label>
    <label>Notes<textarea name="notes" rows="2"></textarea></label>
    <label class="check" id="concurWrap"><input type="checkbox" name="concur"> Entered in Concur</label>
    <div class="dlg-actions">
      <button type="button" class="danger" data-act="delete-visit" id="visitDel">Delete</button>
      <span class="grow"></span>
      <button type="button" data-act="close">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="facDlg">
  <form id="facForm">
    <h2 id="facTitle">Facility</h2>
    <label>Nickname (what the calendar and lists show)<input name="name" required></label>
    <label>Business name (optional: the official name, used to look up the address)
      <span class="row" style="flex-wrap:nowrap;margin-top:3px">
        <input name="business" placeholder="Leave blank to look up by Nickname" style="margin-top:0;flex:1;min-width:0">
        <button type="button" data-act="lookup" title="Look up the business name (or the Nickname) and fill in the first address found" style="white-space:nowrap">Fill address ↓</button>
      </span>
    </label>
    <label style="margin-bottom:4px">Address (used for the Concur mileage lookup)
      <span class="row" style="flex-wrap:nowrap;margin-top:3px">
        <input name="address" placeholder="Optional: city, to narrow the fill" style="margin-top:0;flex:1;min-width:0">
        <button type="button" data-act="maps" title="Search Google Maps for the business name (or the Nickname) in a new tab, then copy the address back" style="white-space:nowrap"><span class="wide-only">Find on </span>Google Maps ↗</button>
      </span>
    </label>
    <div id="lookupMsg" class="small muted" style="margin-bottom:10px"></div>
    <label>Type<select name="type"></select></label>
    <label class="check"><input type="checkbox" name="ancillary"> <span title="This facility does not need regular visits" style="cursor:help;border-bottom:1px dotted var(--muted)">Ancillary</span></label>
    <label>Notes<textarea name="notes" rows="2"></textarea></label>
    <div class="dlg-actions">
      <button type="button" class="danger" data-act="delete-fac" id="facDel">Delete</button>
      <span class="grow"></span>
      <button type="button" data-act="close">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="batchDlg">
  <form id="batchForm">
    <h2>Add several facilities</h2>
    <label>One nickname per line<textarea name="names" rows="10" placeholder="Oaks&#10;Rainier Rehab&#10;Puget Sound TC"></textarea></label>
    <label>Type for all of these<select name="type"></select></label>
    <p class="small muted">Business names (for the address lookup), addresses and notes can be added afterward with Edit.</p>
    <div class="dlg-actions">
      <span class="grow"></span>
      <button type="button" data-act="close">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="textDlg">
  <h2 id="textTitle">Copy</h2>
  <p class="muted small">You can edit this before copying.</p>
  <textarea class="out" id="textOut"></textarea>
  <div class="dlg-actions"><span class="grow"></span>
    <button type="button" data-act="close">Close</button>
    <button type="button" class="primary" data-act="copy-text">Copy</button>
  </div>
</dialog>

<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="toast"></div>

<script>
'use strict';
// The team server: a Cloudflare Worker (see worker/worker.js) that stores everyone's data and looks up addresses.
const SERVER_URL = 'https://facility-lookup.measure-717.workers.dev';

// ---------- storage ----------
// The server holds the real copy. This browser keeps a cache so the app opens instantly
// and unsaved changes survive a dropped connection or closed tab.
const LEGACY_KEY = 'facilityVisitTracker.v1';          // data from before the server existed
const SESSION_KEY = 'facilityVisitTracker.session';    // {passcode, user}
const CACHE_PREFIX = 'facilityVisitTracker.cache.';    // + lowercased name → {data, version, dirty}
const UIKEY = 'facilityVisitTracker.ui';
function blank(){ return {facilities:[], visits:[], settings:{localWeeks:6, remoteWeeks:8, soonDays:14, officeDay:1, yourName:''}}; }
function normalize(d){
  d = d || {};
  return {facilities:d.facilities||[], visits:d.visits||[], settings:Object.assign(blank().settings, d.settings||{})};
}
function readJson(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function writeJson(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

let db = blank();
let session = readJson(SESSION_KEY) || {};
let ready = false;   // true once a user's data is loaded
const sync = {version:0, dirty:false, inflight:false, state:'saved', error:'', retry:null, timer:null};
let ui = readJson(UIKEY) || {};
function saveUi(){ writeJson(UIKEY, ui); }

const cacheKey = () => CACHE_PREFIX + (session.user||'').toLowerCase();
function writeCache(){ writeJson(cacheKey(), {data:db, version:sync.version, dirty:sync.dirty}); }
function save(){
  db.visits.forEach(v => { v.status = v.facilityId ? statusByDate(v.date) : 'planned'; });
  sync.dirty = true;
  writeCache();
  render();
  clearTimeout(sync.timer);
  sync.timer = setTimeout(push, 600);
}

async function api(path, opts){
  opts = opts || {};
  const headers = {'X-Team-Passcode': session.passcode || ''};
  if(opts.body) headers['Content-Type'] = 'application/json';
  const r = await fetch(SERVER_URL + path, Object.assign({}, opts, {headers}));
  if(r.status===401 || r.status===429){
    const e = new Error(r.status===401 ? 'Wrong passcode' : 'Too many wrong passcodes. Try again in an hour.');
    e.code = r.status; throw e;
  }
  return r;
}
async function errorText(r){ try{ return (await r.json()).error || ('error '+r.status); }catch(e){ return 'error '+r.status; } }

async function push(){
  if(sync.inflight || !sync.dirty || !session.user) return;
  sync.inflight = true; setSync('saving');
  const sent = JSON.stringify(db);
  try{
    const r = await api('/data?user='+encodeURIComponent(session.user),
      {method:'PUT', body: JSON.stringify({data:db, baseVersion:sync.version})});
    if(r.status===409){ resolveConflict(await r.json()); }
    else if(!r.ok){ throw new Error(await errorText(r)); }
    else{
      sync.version = (await r.json()).version;
      if(JSON.stringify(db)===sent) sync.dirty = false;   // else edited mid-save; go again
      writeCache();
      setSync('saved');
    }
  }catch(e){
    if(e.code===401){ sync.inflight = false; return forgetPasscode(); }
    setSync('offline', e.message);
    clearTimeout(sync.retry); sync.retry = setTimeout(push, 30000);
  }finally{
    sync.inflight = false;
  }
  setSync(sync.state, sync.error);
  if(sync.dirty && sync.state!=='offline') push();
}
function resolveConflict(server){
  const useServer = confirm('Your tracker was changed on another device since this page loaded.\n\n'
    + 'OK: use the latest saved version (the changes made here will be lost).\n'
    + 'Cancel: keep this version and replace the other device’s changes.');
  sync.version = server.version;
  if(useServer){ db = normalize(server.data); sync.dirty = false; writeCache(); render(); toast('Loaded the latest version'); }
  // else stays dirty and push() saves again on top of the new version
}
// "Saved" only when nothing is waiting to reach the server
function syncLabel(){
  return sync.state==='offline' ? '<span class="warn">Not saved</span>' : (sync.dirty || sync.inflight) ? 'Saving…' : 'Saved ✓';
}
function setSync(state, error){
  sync.state = state; sync.error = error || '';
  const el = document.getElementById('syncState');
  if(el) el.innerHTML = syncLabel();
  document.getElementById('banner').innerHTML = renderBanner();
}

// Load the signed-in user's data, preferring unsaved local changes when they're still current.
async function loadUser(){
  const cache = readJson(cacheKey());
  if(cache){ db = normalize(cache.data); sync.version = cache.version; sync.dirty = !!cache.dirty; ready = true; render(); }
  let r;
  try{ r = await api('/data?user='+encodeURIComponent(session.user)); }
  catch(e){
    if(e.code===401) return forgetPasscode();
    if(e.code===429) return showSignIn(e.message);
    if(cache){ setSync('offline', e.message); clearTimeout(sync.retry); sync.retry = setTimeout(push, 30000); return; }
    return showSignIn('Can’t reach the server ('+e.message+'). Check your connection and try again.');
  }
  if(r.status===404){
    // New user: bring along anything this browser had from before the server existed
    const legacy = readJson(LEGACY_KEY);
    const n = legacy ? (legacy.facilities||[]).length + (legacy.visits||[]).length : 0;
    if(!cache && n && confirm(`This browser has ${(legacy.facilities||[]).length} facilities and ${(legacy.visits||[]).length} visits saved from before. Move them into your tracker?`)){
      db = normalize(legacy);
      try{ localStorage.removeItem(LEGACY_KEY); }catch(e){}
    }else if(!cache){ db = blank(); }
    sync.version = 0; sync.dirty = true; ready = true;
    save();
    return;
  }
  if(!r.ok) return showSignIn('Server problem: '+await errorText(r));
  const server = await r.json();
  session.user = server.name; writeJson(SESSION_KEY, session);   // use the stored spelling
  // sync.dirty (not cache.dirty): the cached copy is on screen while this loads and may have been edited meanwhile
  if(server.version < sync.version){ /* a save already went through while this was loading */ }
  else if(sync.dirty && sync.version===server.version){ push(); }                // finish saving what was left
  else if(sync.dirty){ resolveConflict(server); push(); }
  else{ db = normalize(server.data); sync.version = server.version; writeCache(); }
  ready = true; render(); setSync(sync.dirty ? 'saving' : 'saved');
}
// Pick up changes made on another device when this tab comes back into view
async function refreshFromServer(){
  if(!ready || sync.dirty || sync.inflight || document.querySelector('dialog[open]')) return;
  try{
    const r = await api('/data?user='+encodeURIComponent(session.user));
    if(!r.ok) return;
    const server = await r.json();
    // Re-check: an edit or save may have started while this request was out
    if(server.version > sync.version && !sync.dirty && !sync.inflight && !document.querySelector('dialog[open]')){
      db = normalize(server.data); sync.version = server.version; writeCache(); render(); toast('Updated with changes from another device');
    }
  }catch(e){ if(e.code===401) forgetPasscode(); }
}

// ---------- sign-in ----------
function forgetPasscode(){ session = {user: session.user}; writeJson(SESSION_KEY, session); showSignIn('The team passcode has changed. Enter the new one.'); }
function signOut(){
  if(sync.dirty && !confirm('Some changes haven’t reached the server yet and will be lost. Switch anyway?')) return;
  session = {passcode: session.passcode}; writeJson(SESSION_KEY, session);
  db = blank(); ready = false; sync.version = 0; sync.dirty = false;
  showSignIn();
}
async function showSignIn(msg){
  ready = false;
  document.body.classList.add('signed-out');
  document.getElementById('banner').innerHTML = '';
  const view = document.getElementById('view');
  view.innerHTML = `<div class="panel signin"><p class="muted">Loading names…</p></div>`;
  let users = [];
  try{
    const r = await api('/users');
    if(!r.ok) throw new Error(await errorText(r));
    users = (await r.json()).users;
  }catch(e){
    // 401: the server has a team passcode set (TEAM_PASSCODE) and we don't have the right one
    if(e.code===401){
      if(session.passcode) msg = 'That passcode isn’t right.';
      session = {user: session.user}; writeJson(SESSION_KEY, session);

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const S = () => db.settings;

// ---------- dates (all as local YYYY-MM-DD strings) ----------
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const today = () => iso(new Date());
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const fmt = (s,o) => parse(s).toLocaleDateString(undefined, o||{month:'short',day:'numeric'});
const fmtDay = s => fmt(s,{weekday:'short',month:'short',day:'numeric'});
const sundayOf = s => { const d = parse(s); d.setDate(d.getDate()-d.getDay()); return iso(d); };
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); };
function ago(n){ if(n===0) return 'today'; if(n<14) return n+' day'+(n===1?'':'s')+' ago'; return Math.round(n/7)+' wks ago'; }

// ---------- helpers ----------
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fac = id => db.facilities.find(f => f.id===id);
const endOf = v => (!v.facilityId && v.endDate && v.endDate>v.date) ? v.endDate : v.date;
const overlaps = (v, a, b) => v.date<b && endOf(v)>=a;   // b exclusive
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const isOffice = d => S().officeDay>=0 && parse(d).getDay()===S().officeDay;
// The office day as it actually happens: not on a holiday, and not when a team event,
// PTO or Bank Day covers it or a facility visit is booked
const officeHappens = d => isOffice(d) && !holidayOn(d) && !blockOn(d) && !db.visits.some(v => v.facilityId && v.date===d);
const blockOn = d => db.visits.find(v => !v.facilityId && v.date<=d && endOf(v)>=d);
function whenText(v){
  const e = endOf(v);
  return e===v.date ? fmtDay(v.date) : fmt(v.date,{weekday:'short',month:'short',day:'numeric'})+' – '+fmtDay(e);
}
// Team holidays, using the federal "observed" rule: a Saturday holiday is taken the
// Friday before, a Sunday holiday the Monday after.
const holidayCache = {};
function holidaysFor(y){
  if(holidayCache[y]) return holidayCache[y];
  const nth = (m, wd, n) => { const d = new Date(y, m, 1); d.setDate(1 + (wd - d.getDay() + 7) % 7 + (n-1)*7); return d; };
  const last = (m, wd) => { const d = new Date(y, m+1, 0); d.setDate(d.getDate() - (d.getDay() - wd + 7) % 7); return d; };
  const observed = (m, day) => { const d = new Date(y, m, day); if(d.getDay()===6) d.setDate(day-1); else if(d.getDay()===0) d.setDate(day+1); return d; };
  const thanks = nth(10, 4, 4), after = new Date(y, 10, thanks.getDate()+1);
  const list = [[observed(0,1),'New Year’s Day'], [last(4,1),'Memorial Day'], [observed(6,4),'Independence Day'],
    [nth(8,1,1),'Labor Day'], [thanks,'Thanksgiving'], [after,'Day after Thanksgiving'], [observed(11,25),'Christmas']];
  const map = {};
  list.forEach(([d, name]) => { map[iso(d)] = name; });
  return holidayCache[y] = map;
}
// Next year's New Year's Day can be observed on Dec 31, so check both years
const holidayOn = d => { const y = +d.slice(0,4); return holidaysFor(y)[d] || holidaysFor(y+1)[d] || ''; };
const isWeekend = d => { const wd = parse(d).getDay(); return wd===0 || wd===6; };
// Why a facility visit on this day would be unusual, or '' if it's a normal visit day
function dayProblem(d){
  if(d < today()) return '';   // the past is a record, not a plan: nothing to warn about
  const h = holidayOn(d);
  if(h) return 'is '+h;
  if(isWeekend(d)) return 'is a weekend';
  if(isOffice(d)) return 'is an office day';
  const b = blockOn(d);
  return b ? 'is during '+visitLabel(b) : '';
}
// Weekdays minus the office day, holidays and days taken by team meetings/projects
function weekCapacity(ws){
  let avail = 0; const used = new Set();
  for(let i=0;i<7;i++){
    const d = addDays(ws,i), wd = parse(d).getDay();
    if(wd===0 || wd===6 || isOffice(d) || holidayOn(d) || blockOn(d)) continue;
    avail++;
    if(db.visits.some(v => v.facilityId && v.date===d)) used.add(d);
  }
  return {avail, used: used.size};
}
// Non-facility entries: team meetings/projects, PTO and Bank Days (older entries have no kind = team)
const ANC_TIP = 'This facility does not need regular visits';
const KINDS = {team:'Team meeting / project', pto:'PTO', bank:'Bank Day'};
const kindOf = v => v.facilityId ? '' : (v.kind || 'team');
// What managers and facilities see: a Bank Day is just PTO to them
const outLabel = v => kindOf(v)==='bank' ? 'PTO' : visitLabel(v);
// Bank Days: at most two per calendar month, counting each weekday (not weekends or holidays) an entry covers
const BANK_LIMIT = 2, BANK_LIMIT_MSG = 'Only two bank days may be used in a calendar month';
// Bank days are tied to the month they're earned for, so one period can't run into the next month
const BANK_SPAN_MSG = 'A bank day period can’t span two calendar months';
const bankSpanOk = e => endOf(e).slice(0,7) === e.date.slice(0,7);
function bankDaysUsed(entries){
  const used = {};
  entries.filter(v => kindOf(v)==='bank').forEach(v => {
    for(let d = v.date; d <= endOf(v); d = addDays(d, 1))
      if(!isWeekend(d) && !holidayOn(d)) used[d.slice(0,7)] = (used[d.slice(0,7)]||0) + 1;
  });
  return used;
}
// Would saving `entry` (new or changed) push any month it touches past the limit?
function bankLimitOk(entry){
  const used = bankDaysUsed(db.visits.filter(v => v.id!==entry.id).concat([entry]));
  return Object.keys(bankDaysUsed([entry])).every(m => used[m] <= BANK_LIMIT);
}
const visitLabel = v => v.facilityId ? (fac(v.facilityId)||{name:'(deleted facility)'}).name : (v.label||'Other');

function typeInfo(t){

    ? {short:'Fly', long:'Fly, every '+S().remoteWeeks+' wks', weeks:S().remoteWeeks}

// ---------- overdue logic ----------
function facilityStatus(f){
  const t = today();
  const mine = db.visits.filter(v => v.facilityId===f.id);
  const done = mine.filter(v => v.date<=t).map(v => v.date).sort();
  const planned = mine.filter(v => v.date>t).map(v => v.date).sort();
  const info = typeInfo(f.type);
  const last = done.length ? done[done.length-1] : null;
  const due = last && !f.ancillary ? addDays(last, info.weeks*7) : null;   // ancillary: no regular visits, so never due
  const next = planned[0] || null;
  const daysLeft = due ? daysBetween(t, due) : null;
  const level = f.ancillary ? 'ancillary' : !last ? 'never' : daysLeft<0 ? 'overdue' : daysLeft<=S().soonDays ? 'soon' : 'ok';
  const planLate = !!(next && due && next>due);
  const needsPlan = level!=='ok' && level!=='ancillary' && (!next || planLate);
  return {f, info, last, due, next, daysLeft, level, planLate, needsPlan};
}
function allStatus(){
  return db.facilities.map(facilityStatus).sort((a,b) => {
    if(!!a.f.ancillary !== !!b.f.ancillary) return a.f.ancillary ? 1 : -1;   // ancillary always last
    const ka = a.daysLeft==null ? -1e9 : a.daysLeft, kb = b.daysLeft==null ? -1e9 : b.daysLeft;
    return ka-kb || a.f.name.localeCompare(b.f.name);
  });
}
function statusText(r){
  if(r.level==='ancillary') return 'Ancillary';
  if(r.level==='never') return 'No visits logged';
  if(r.daysLeft<0) return (-r.daysLeft)+' day'+(r.daysLeft===-1?'':'s')+' overdue';
  if(r.daysLeft===0) return 'Due today';
  return 'Due in '+r.daysLeft+' day'+(r.daysLeft===1?'':'s');
}
// A facility visit's status follows its date: today or earlier happened, later is planned
const statusByDate = d => d <= today() ? 'completed' : 'planned';
const isDone = v => v.date <= today();

function renderSchedule(){

  h += `<div class="palette quick">${quick}</div>

// ---------- drag & drop / tap-to-place ----------
let placing = null;   // {kind:'fac', fid} | {kind:'team'|'pto'|'bank'} while waiting for a day tap
function dropOn(date, item){
  if(item.kind==='team'){
    openVisit(null, {facilityId:'', kind:'team', date, endDate:date, status:'planned'});
    return;
  }
  if(item.kind==='bank' && !bankLimitOk({id:'new', facilityId:'', kind:'bank', date, endDate:''})){ alert(BANK_LIMIT_MSG); return; }
  if(item.kind==='pto' || item.kind==='bank'){
    const booked = db.visits.filter(v => v.facilityId && v.date===date);
    if(booked.length && !confirm(fmtDay(date)+' already has '+booked.map(visitLabel).join(', ')+'. Add '+KINDS[item.kind]+' anyway?')) return;
    db.visits.push({id:uid(), facilityId:'', kind:item.kind, label:KINDS[item.kind], date, endDate:'', status:'planned', notes:'', concur:false});
    save(); toast(KINDS[item.kind]+' on '+fmtDay(date)+'. Click it to make it longer.');
    return;
  }
  if(item.kind==='visit'){
    const v = db.visits.find(x => x.id===item.id);
    if(!v || v.date===date) return;
    if(v.facilityId){
      const why = dayProblem(date);
      if(why && !confirm(fmtDay(date)+' '+why+'. Move the visit there anyway?')) return;
      v.date = date;
    }else{
      const len = daysBetween(v.date, endOf(v));
      const moved = Object.assign({}, v, {date, endDate: v.endDate ? addDays(date, len) : ''});
      if(kindOf(v)==='bank' && !bankSpanOk(moved)){ alert(BANK_SPAN_MSG); return; }
      if(kindOf(v)==='bank' && !bankLimitOk(moved)){ alert(BANK_LIMIT_MSG); return; }
      v.date = moved.date;
      v.endDate = moved.endDate;
    }
    save(); toast('Moved to '+fmtDay(date));
    return;
  }
  const f = fac(item.fid);
  if(!f) return;
  if(db.visits.some(v => v.facilityId===f.id && v.date===date)){ toast(f.name+' is already on '+fmtDay(date)); return; }
  const why = dayProblem(date);
  if(why && !confirm(fmtDay(date)+' '+why+'. Book '+f.name+' anyway?')) return;
  const past = date < today();
  db.visits.push({id:uid(), facilityId:f.id, date, status:statusByDate(date), notes:'', label:'', endDate:'', concur:false});
  save(); toast((past?'Recorded ':'Booked ')+f.name+' on '+fmtDay(date));
}

});
document.addEventListener('drop', e => {
  const day = e.target.closest && e.target.closest('.day[data-date]');
  document.querySelectorAll('.day.over').forEach(x => x.classList.remove('over'));
  if(!day) return;
  e.preventDefault();
  let item; try{ item = JSON.parse(e.dataTransfer.getData('text/plain')); }catch(x){ return; }
  if(placing) setPlacing(null);
  dropOn(day.dataset.date, item);
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && placing) setPlacing(null); });

function logRange(){
  const t = parse(today());
  const from = ui.logFrom || iso(new Date(t.getFullYear(), t.getMonth()-1, 1));
  const to = ui.logTo || today();
  return {from, to, open: !!ui.logOpen};
}
function logVisits(r){
  return db.visits.filter(v => v.facilityId && isDone(v) && v.date>=r.from && v.date<=r.to && (!r.open || !v.concur))
    .sort((a,b)=>a.date.localeCompare(b.date));
}
function renderLog(){
  const r = logRange();
  const vs = logVisits(r);
  const open = vs.filter(v=>!v.concur).length;
  return `<div class="toolbar">
      <label>From<input type="date" id="logFrom" value="${r.from}"></label>
      <label>To<input type="date" id="logTo" value="${r.to}"></label>
      <label class="check"><input type="checkbox" id="logOpen" ${r.open?'checked':''}> Only visits not yet in Concur</label>

}

// ---------- exports ----------
function emailText(){
  const r = schedRange(), s = S();
  const vs = rangeVisits(r);
  const lines = [];
  lines.push('Planned visits' + (s.yourName ? ' – '+s.yourName : ''));
  lines.push(fmt(addDays(r.start,1),{month:'short',day:'numeric'})+' – '+fmt(addDays(r.end,-2),{month:'short',day:'numeric',year:'numeric'})+' (subject to change)');
  for(let w=0; w<r.weeks; w++){
    const ws = addDays(r.start, w*7), we = addDays(ws,7);
    lines.push('', 'Week of '+fmt(addDays(ws,1)));
    const rows = vs.filter(v => overlaps(v, ws, we)).map(v => [v.date, '  '+whenText(v)+' – '+outLabel(v)]);
    for(let i=1; i<=5; i++){
      const d = addDays(ws, i), hol = holidayOn(d);
      if(hol) rows.push([d, '  '+fmtDay(d)+' – '+hol+' (holiday)']);
      else if(officeHappens(d)) rows.push([d, '  '+fmtDay(d)+' – Office day']);
    }
    rows.sort((a,b) => a[0].localeCompare(b[0]));
    if(!rows.length) lines.push('  No visits scheduled');
    rows.forEach(x => lines.push(x[1]));
  }
  return lines.join('\n');
}
const icsEsc = s => String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function icsFile(){
  const r = schedRange(), s = S();
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const out = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Facility Visit Tracker//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  rangeVisits(r).filter(v => endOf(v)>=today()).forEach(v => {
    const f = v.facilityId ? fac(v.facilityId) : null;
    out.push('BEGIN:VEVENT', 'UID:'+v.id+'@facility-visit-tracker', 'DTSTAMP:'+stamp,
      'DTSTART;VALUE=DATE:'+v.date.replace(/-/g,''), 'DTEND;VALUE=DATE:'+addDays(endOf(v),1).replace(/-/g,''),
      'SUMMARY:'+icsEsc((s.yourName?s.yourName+': ':'')+outLabel(v)+(v.facilityId?' (tentative)':'')));
    if(f && f.address) out.push('LOCATION:'+icsEsc(f.address));
    if(v.notes && kindOf(v)!=='bank') out.push('DESCRIPTION:'+icsEsc(v.notes));   // Bank Day notes stay private
    out.push('TRANSP:TRANSPARENT','END:VEVENT');
  });
  out.push('END:VCALENDAR');
  return out.join('\r\n');
}
const csvCell = x => { x = String(x==null?'':x); return /[",\n]/.test(x) ? '"'+x.replace(/"/g,'""')+'"' : x; };
function csvFile(){
  const rows = [['Date','Facility','Address','Type','Notes','Entered in Concur']];
  logVisits(logRange()).forEach(v => {
    const f = fac(v.facilityId);
    rows.push([v.date, visitLabel(v), f?f.address:'', f?typeInfo(f.type).short:'', v.notes, v.concur?'Yes':'No']);
  });
  return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}

// Address lookup: Google via the team server, else OpenStreetMap (free, no key).
// Button-triggered only, per Nominatim's usage policy.
let lookupResults = [], lookupBusy = false;
function osmAddress(a){
  const street = [a.house_number, a.road].filter(Boolean).join(' ');
  const city = a.city || a.town || a.village || a.hamlet || '';
  const st = (a['ISO3166-2-lvl4']||'').replace(/^US-/,'') || a.state || '';
  if(!street && !city) return '';
  return [street, city, [st, a.postcode].filter(Boolean).join(' ')].filter(Boolean).join(', ');
}
async function searchGoogle(q){
  const r = await api('/lookup?q=' + encodeURIComponent(q));
  if(!r.ok) throw new Error('error '+r.status);
  return ((await r.json()).results || []).map(x => ({addr: x.address, name: x.name, street: /^\d/.test(x.address)}));
}
async function searchOsm(q){
  const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&countrycodes=us&q=' + encodeURIComponent(q));
  if(!r.ok) throw new Error('error '+r.status);
  return (await r.json()).map(x => ({addr: osmAddress(x.address||{}), name: x.name||'', street: !!(x.address||{}).house_number}))
    .filter(x => x.addr);
}
async function lookupAddress(){
  const msg = document.getElementById('lookupMsg');
  const name = facForm.business.value.trim() || facForm.name.value.trim();
  if(!name){ toast('Enter a nickname or business name first'); facForm.name.focus(); return; }
  if(lookupBusy) return;
  lookupBusy = true;
  const hint = facForm.address.value.trim();
  const q = hint ? name+', '+hint : name;
  let source = '', googleErr = '';
  try{
    lookupResults = [];
    if(SERVER_URL){
      msg.textContent = 'Searching Google…';
      try{ lookupResults = await searchGoogle(q); source = 'Google'; }
      catch(e){ googleErr = e.message; }
    }
    if(!lookupResults.length){
      msg.textContent = 'Searching OpenStreetMap…';
      lookupResults = await searchOsm(q); source = 'OpenStreetMap';
    }
    if(!lookupResults.length){
      msg.innerHTML = 'No match found. Type the city into the address box and try again, or use Google Maps.';
      return;
    }
    const top = lookupResults[0];
    facForm.address.value = top.addr;
    msg.innerHTML = `Filled from ${source}${top.name?' (matched “'+esc(top.name)+'”)':''}. Please check it.`
      + (googleErr ? ` <span class="muted">(Google lookup unavailable: ${esc(googleErr)})</span>` : '')
      + (top.street ? '' : ' <span class="warn">No street number found.</span>')
      + (lookupResults.length>1 ? '<div class="row" style="margin-top:4px">Other matches: '
        + lookupResults.slice(1).map((x,i) => `<button type="button" class="small" data-act="pick-addr" data-i="${i+1}">${esc(x.name ? x.name+' – ' : '')}${esc(x.addr)}</button>`).join('') + '</div>' : '');
  }catch(e){
    msg.textContent = 'Lookup failed (' + e.message + '). Use Google Maps instead.';
  }finally{
    lookupBusy = false;
  }
}
const batchDlg = document.getElementById('batchDlg'), batchForm = document.getElementById('batchForm');
function openBatch(){
  const s = S();
  batchForm.type.innerHTML = `<option value="local">Drive: visit at least every ${s.localWeeks} weeks</option><option value="remote">Fly: visit at least every ${s.remoteWeeks} weeks</option>`;

batchForm.addEventListener('submit', e => {
  e.preventDefault();
  const have = new Set(db.facilities.map(f => f.name.toLowerCase()));
  let added = 0, skipped = 0;
  batchForm.names.value.split(/\r?\n/).map(x => x.trim().replace(/\s+/g, ' ')).filter(Boolean).forEach(name => {
    if(have.has(name.toLowerCase())){ skipped++; return; }   // already a facility, or listed twice
    have.add(name.toLowerCase());
    db.facilities.push({id:uid(), name, business:'', address:'', type:batchForm.type.value, notes:''});
    added++;
  });
  batchDlg.close();
  if(added) save();
  toast(`Added ${added} facilit${added===1?'y':'ies'}` + (skipped ? ` · skipped ${skipped} already on the list` : ''));
});
facForm.addEventListener('submit', e => {
  e.preventDefault();
  const data = {name:facForm.name.value.trim(), business:facForm.business.value.trim(), address:facForm.address.value.trim(), type:facForm.type.value, ancillary:facForm.ancillary.checked, notes:facForm.notes.value.trim()};

// ---------- events ----------
document.addEventListener('click', e => {
  // Tap-to-place: after tapping a palette button, the next tap on a day places it
  if(placing){
    const day = e.target.closest('.day[data-date]');
    if(day){ const p = placing; setPlacing(null); dropOn(day.dataset.date, p); return; }
  }
  const b = e.target.closest('[data-act],[data-tab]');
  if(!b) return;
  if(b.dataset.tab && !b.dataset.act){ ui.tab = b.dataset.tab; saveUi(); render(); return; }
  const id = b.dataset.id, v = id ? db.visits.find(x => x.id===id) : null;
  switch(b.dataset.act){
    case 'tab': ui.tab = b.dataset.tab; saveUi(); render(); break;
    case 'close': b.closest('dialog').close(); break;
    case 'new-visit': openVisit(null, {date: b.dataset.status==='completed' ? today() : addDays(today(), 1), facilityId: b.dataset.other ? '' : b.dataset.fid || (db.facilities.length ? db.facilities.slice().sort(byName)[0].id : ''), status: b.dataset.status || 'planned'}); break;
    case 'edit-visit': openVisit(v); break;
    case 'arm': {
      const p = KINDS[b.dataset.drag] ? {kind:b.dataset.drag} : {kind:'fac', fid:b.dataset.fid};
      const same = placing && placing.kind===p.kind && placing.fid===p.fid;
      setPlacing(same ? null : p);
      break;
    }
    case 'sched-move': ui.schedStart = addDays(schedRange().start, 7*(+b.dataset.n)); saveUi(); render(); break;
    case 'sched-today': ui.schedStart = sundayOf(today()); saveUi(); render(); break;
    case 'delete-visit':
      if(editingVisit && confirm('Delete this entry?')){ db.visits = db.visits.filter(x => x!==editingVisit); visitDlg.close(); save(); }
      break;
    case 'copy-addr': copy(fac(v.facilityId).address); break;
    case 'add-fac': openFac(null); break;
    case 'add-batch': openBatch(); break;
    case 'lookup': lookupAddress(); break;
    case 'pick-addr': {
      const x = lookupResults[+b.dataset.i];
      if(x){ facForm.address.value = x.addr; document.getElementById('lookupMsg').textContent = 'Address set. Please check it.'; }
      break;
    }
    case 'maps': {
      const q = facForm.business.value.trim() || facForm.name.value.trim();
      if(!q){ toast('Enter a nickname or business name first'); facForm.name.focus(); break; }
      window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q), '_blank', 'noopener');
      break;
    }
    case 'edit-fac': openFac(fac(id)); break;
    case 'delete-fac': {
      const n = db.visits.filter(x => x.facilityId===editingFac.id).length;
      if(confirm(`Delete ${editingFac.name}${n?` and its ${n} visit record${n>1?'s':''}`:''}? This can’t be undone.`)){
        db.visits = db.visits.filter(x => x.facilityId!==editingFac.id);
        db.facilities = db.facilities.filter(x => x!==editingFac);
        facDlg.close(); save();
      }
      break;
    }
    case 'email-text': showText('Schedule for email', emailText()); break;
    case 'copy-text': copy(document.getElementById('textOut').value); break;
    case 'ics': download('visit-schedule.ics', icsFile(), 'text/calendar'); break;
    case 'csv': { const r = logRange(); download(`visits_${r.from}_to_${r.to}.csv`, csvFile(), 'text/csv'); break; }
    case 'export':
      download(`facility-visits-${today()}.json`, JSON.stringify(db, null, 2), 'application/json'); break;
    case 'retry-push': clearTimeout(sync.retry); push(); break;
    case 'retry-signin': showSignIn(); break;
    case 'switch-user': signOut(); break;
    case 'import': document.getElementById('importFile').click(); break;
    case 'wipe':
      if(confirm('Erase all your facilities and visits from the server? Export a copy first if you might need them.')){ db = blank(); save(); }
      break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.classList.contains('concur-cb')){ const v = db.visits.find(x => x.id===t.dataset.id); if(v){ v.concur = t.checked; save(); } return; }
  if(t.dataset.set){
    const k = t.dataset.set;
    if(k==='yourName') db.settings[k] = t.value.trim();
    else { const n = parseInt(t.value,10); if(isNaN(n) || (n<0 && k!=='officeDay')) return; db.settings[k] = n; }
    save(); return;
  }
  if(t.id==='schedStart' && t.value){ ui.schedStart = sundayOf(t.value); }
  else if(t.id==='schedWeeks'){ ui.schedWeeks = parseInt(t.value,10); }
  else if(t.id==='logFrom'){ ui.logFrom = t.value; }
  else if(t.id==='logTo'){ ui.logTo = t.value; }
  else if(t.id==='logOpen'){ ui.logOpen = t.checked; }
  else return;
  saveUi(); render();
});
document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  file.text().then(txt => {
    const d = JSON.parse(txt);
    if(!Array.isArray(d.facilities) || !Array.isArray(d.visits)) throw new Error('bad');
    if(!confirm(`Replace your tracker with ${d.facilities.length} facilities and ${d.visits.length} visits from this backup?`)) return;
    db = normalize(d);
    save(); toast('Imported');
  }).catch(() => alert('That file isn’t a Facility Visit Tracker backup.'));
});

window.addEventListener('online', () => { if(sync.dirty) push(); });
document.addEventListener('visibilitychange', () => { if(!document.hidden) refreshFromServer(); });
window.addEventListener('beforeunload', e => { if(sync.dirty){ e.preventDefault(); e.returnValue = ''; } });

if(session.user) loadUser(); else showSignIn();
