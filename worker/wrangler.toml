# Deploys automatically when main is pushed (Workers Builds). Manual fallback from this folder:  npx wrangler@4 deploy
# Secrets (GOOGLE_API_KEY, TEAM_CODE, PIN_PEPPER) are set with `wrangler secret put` and never stored here.
name = "facility-lookup"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[vars]
# Pages other than the Worker's own that may call it (the GitHub Pages copy)
ALLOWED_ORIGINS = "https://measure76.github.io"

[[d1_databases]]
binding = "DB"
database_name = "facility-tracker"
database_id = "ad1ec226-c72c-4850-9be5-3c221431edfd"

# Bundle ../index.html into the Worker so it can serve the app itself (GET /)
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
